# Source: claude-sandbox/templates/networkpolicy.yaml
# Backstop for srt's proxy allowlist: the pod (including anything outside bubblewrap) may only
# resolve names at the cluster DNS and open TCP/443 to the allowlisted names. No ingress, no
# cluster-internal or LAN destinations (ADR-0006).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cs-claude-sandbox-homelab
  namespace: claude-sandbox
  labels:
    helm.sh/chart: claude-sandbox-0.1.0
    app.kubernetes.io/name: claude-sandbox
    app.kubernetes.io/instance: cs
    app.kubernetes.io/version: "0.0.81"
    app.kubernetes.io/managed-by: Helm
    claude-sandbox/name: homelab
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: claude-sandbox
      app.kubernetes.io/instance: cs
      claude-sandbox/name: homelab
      claude-sandbox/kind: workspace
  # An empty ingress rule turns on ingress enforcement and allows nothing.
  ingress:
    - {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: "kube-dns"
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: telltaledns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: "api.anthropic.com"
        - matchName: "claude.ai"
        - matchName: "claude.com"
        - matchName: "platform.claude.com"
        - matchName: "sso.claude.com"
        - matchName: "code.claude.com"
        - matchName: "github.com"
        - matchPattern: "*.github.com"
        - matchPattern: "*.githubusercontent.com"
        - matchName: "registry.npmjs.org"
        - matchPattern: "*.npmjs.org"
        - matchName: "pypi.org"
        - matchName: "files.pythonhosted.org"
        - matchPattern: "*.sororlab.dev"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
