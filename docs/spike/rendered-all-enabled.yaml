apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cs-claude-sandbox-homelab-workspace
  namespace: claude-sandbox
  labels:
    helm.sh/chart: claude-sandbox-0.1.0
    app.kubernetes.io/name: claude-sandbox
    app.kubernetes.io/instance: cs
    app.kubernetes.io/version: "0.0.81"
    app.kubernetes.io/managed-by: Helm
    claude-sandbox/name: homelab
    claude-sandbox/volume: workspace
  annotations:
    helm.sh/resource-policy: keep
spec:
  # ReadWriteOnce on a local-path volume: the sandbox is pinned to one node, which also means
  # the volume supports the idmapped mount a user-namespace pod needs (ADR-0008).
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
