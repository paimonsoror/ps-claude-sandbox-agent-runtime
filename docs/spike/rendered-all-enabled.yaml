# Source: claude-sandbox/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs-claude-sandbox-homelab
  namespace: claude-sandbox
  labels:
    helm.sh/chart: claude-sandbox-0.1.0
    app.kubernetes.io/name: claude-sandbox
    app.kubernetes.io/instance: cs
    app.kubernetes.io/version: "0.0.81"
    app.kubernetes.io/managed-by: Helm
    claude-sandbox/name: homelab
    claude-sandbox/kind: workspace
spec:
  replicas: 1
  # One pod per sandbox: the volumes are ReadWriteOnce and Remote Control serves one server
  # per Claude home.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: claude-sandbox
      app.kubernetes.io/instance: cs
      claude-sandbox/name: homelab
      claude-sandbox/kind: workspace
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claude-sandbox
        app.kubernetes.io/instance: cs
        claude-sandbox/name: homelab
        claude-sandbox/kind: workspace
      annotations:
        checksum/config: dfc747ac2f3780364321c25b327c53167daa95eb69d1eeb22754f7a4bc51e288
    spec:
      # Pod user namespace: container uid 0 is an unprivileged host uid (ADR-0003).
      hostUsers: false
      serviceAccountName: cs-claude-sandbox
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        # bubblewrap needs mount(2) and unshare(2) with namespace flags, which the runtime's
        # default AppArmor and seccomp profiles deny. srt applies its own seccomp filter to the
        # command it runs (ADR-0003).
        seccompProfile:
          type: Unconfined
        appArmorProfile:
          type: Unconfined
      terminationGracePeriodSeconds: 30
      containers:
        - name: sandbox
          image: "ghcr.io/paimonsoror/claude-sandbox:sha-test"
          imagePullPolicy: IfNotPresent
          # A TTY for the one-time Remote Control confirmation (kubectl attach) and for the
          # server's status display (ADR-0009).
          tty: true
          stdin: true
          securityContext:
            # No masked /proc paths, so bubblewrap can mount a fresh procfs. Only valid with
            # hostUsers: false.
            procMount: Unmasked
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: SANDBOX_KIND
              value: "workspace"
            - name: SANDBOX_NAME
              value: "homelab"
            - name: SANDBOX_WRAP
              value: "srt"
            - name: SRT_SETTINGS
              value: /etc/srt/settings.json
            - name: HOME
              value: /home/agent
            - name: CLAUDE_CODE_TMPDIR
              value: /tmp/claude
            - name: WORKSPACE_REPO
              value: "https://github.com/paimonsoror/homelab-charts.git"
            - name: RC_SPAWN
              value: "worktree"
            - name: RC_CAPACITY
              value: "8"
            - name: RC_PERMISSION_MODE
              value: "default"
            - name: RC_NAME_PREFIX
              value: "homelab"
            - name: RC_VERBOSE
              value: "false"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: claude-sandbox-github
                  key: token
                  optional: true
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: home
              mountPath: /home/agent
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/srt
              readOnly: true
            - name: config
              mountPath: /etc/claude-code
              readOnly: true
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                # Either the server is up or the entrypoint is still waiting for the login.
                - pgrep -f "claude remote-control" >/dev/null || pgrep -f sandbox-entrypoint >/dev/null
            initialDelaySeconds: 60
            periodSeconds: 60
            failureThreshold: 5
          resources:
            limits:
              cpu: "4"
              memory: 6Gi
            requests:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: cs-claude-sandbox-homelab-workspace
        - name: home
          persistentVolumeClaim:
            claimName: cs-claude-sandbox-homelab-home
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: config
          configMap:
            name: cs-claude-sandbox-homelab
            defaultMode: 0444
