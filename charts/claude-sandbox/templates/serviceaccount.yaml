{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "claude-sandbox.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "claude-sandbox.labels" . | nindent 4 }}
# Sandboxes never talk to the Kubernetes API (ADR-0007).
automountServiceAccountToken: false
{{- end }}
