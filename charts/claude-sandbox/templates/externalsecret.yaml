{{- if .Values.externalSecrets.enabled }}
{{- range $sb := .Values.sandboxes }}
{{- if and $sb.enabled (eq $sb.kind "managed-agents-worker") }}
---
# The worker's environment key from Vault through External Secrets Operator (ADR-0007).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $sb.environment.existingSecret }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "claude-sandbox.labels" $ | nindent 4 }}
    claude-sandbox/name: {{ $sb.name }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml $.Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ $sb.environment.existingSecret }}
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_ENVIRONMENT_ID
      remoteRef:
        key: {{ $sb.environment.vaultPath }}
        property: ANTHROPIC_ENVIRONMENT_ID
    - secretKey: ANTHROPIC_ENVIRONMENT_KEY
      remoteRef:
        key: {{ $sb.environment.vaultPath }}
        property: ANTHROPIC_ENVIRONMENT_KEY
{{- end }}
{{- end }}
{{- end }}
