# helm lint/template values: the portable fallback (no user namespaces, no Cilium), the
# inner Claude Bash sandbox instead of the srt wrap, the ExternalSecret for the worker, and a
# definition that overrides most of its kind's defaults.
image:
  tag: sha-test
isolation:
  mode: weak
  wrap: claude-bash-sandbox
  runtimeClassName: gvisor
network:
  policy:
    engine: kubernetes
externalSecrets:
  enabled: true
sandboxes:
  lab:
    kind: workspace
    allowedDomains: [claude.ai, platform.claude.com]
    remoteControl: {spawn: same-dir, capacity: 4, permissionMode: acceptEdits, namePrefix: lab}
    github: {existingSecret: "", key: token}
    env: [{name: EXAMPLE, value: "1"}]
    persistence: {workspace: {size: 5Gi, storageClass: standard}, home: {size: 1Gi, storageClass: standard}, keep: false}
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
  worker:
    kind: managed-agents-worker
    maxIdle: 120s
    logFormat: text
  disabled-one:
    kind: workspace
    enabled: false
